services:

  # ──────────────────────────────────────────────────────── PostgreSQL database
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:               ${POSTGRES_DB:-eduinsight}
      POSTGRES_USER:             ${POSTGRES_USER:-eduinsight}
      POSTGRES_PASSWORD:         ${POSTGRES_PASSWORD:-eduinsight_dev}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"        # 5433 on host → avoid conflict with local PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eduinsight} -d ${POSTGRES_DB:-eduinsight}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ─────────────────────────────────────────────────────────── FastAPI backend
  backend:
    build:
      context: ./backend
      target: runtime          # use the slim runtime stage
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV:         development
      DATABASE_URL:    postgresql+asyncpg://${POSTGRES_USER:-eduinsight}:${POSTGRES_PASSWORD:-eduinsight_dev}@db:5432/${POSTGRES_DB:-eduinsight}
      AGENT_DB_URL:    postgresql://${POSTGRES_USER:-eduinsight}:${POSTGRES_PASSWORD:-eduinsight_dev}@db:5432/${POSTGRES_DB:-eduinsight}
      SECRET_KEY:      ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS:    ${CORS_ORIGINS:-http://localhost:3000}
      LLM_PROVIDER:    ${LLM_PROVIDER:-openai}
      LLM_MODEL:       ${LLM_MODEL:-gpt-4o}
      LLM_API_KEY:     ${LLM_API_KEY:-}
      OPENAI_API_KEY:  ${OPENAI_API_KEY:-}
      GEMINI_API_KEY:  ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY:  ${GEMINI_API_KEY:-}
      RUFF_CACHE_DIR:  /tmp/.ruff_cache
    ports:
      - "8000:8000"
    volumes:
      # Hot-reload: mount source so code changes take effect without rebuild.
      # Remove in production.
      - ./backend/app:/app/app
      - ./backend/scripts:/app/scripts
      - ./backend/migrations:/app/migrations
      - ./backend/tests:/app/tests
      - ./backend/pyproject.toml:/app/pyproject.toml:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ──────────────────────────────────────────────────────── Next.js frontend
  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8000
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3001:3000"
    volumes:
      # Hot-reload: mount source; node_modules stays in container layer
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
    driver: local
