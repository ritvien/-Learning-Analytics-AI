[project]
name = "eduinsight-backend"
version = "0.1.1"
description = "FastAPI backend for EduInsight — AI Student Analytics Platform"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Settings & validation
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    # Database (async)
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",       # PostgreSQL async driver
    "aiosqlite>=0.20.0",     # SQLite async driver (dev/test)
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.0",
    # File handling for syllabus/document uploads
    "python-multipart>=0.0.12",
    "aiofiles>=24.1.0",
    # AI & LangGraph
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-google-genai>=1.0.0",
    "psycopg2-binary>=2.9.0",  # Sync PG driver for tools
    "cachetools>=5.3.0",     # In-memory caching for health score
    # ML dropout pipeline (T52c)
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "joblib>=1.4.0",
    "xgboost>=2.1.0",
]

[project.optional-dependencies]
corpus = ["pymupdf", "pillow", "google-genai", "tiktoken"]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["migrations", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = []
"tests/conftest.py" = ["E402"]
"app/agent/prompts.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
cache_dir = "/tmp/.pytest_cache"
addopts = [
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-fail-under=60",
]
markers = [
    "slow: slow integration or report generation (excluded from default CI; Test.md §8.3)",
    "eval: LLM/RAGAS evaluation — run manually, not in CI (Test.md §8.3)",
    "integration: requires PostgreSQL with pgvector extension (excluded from default CI)",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/migrations/*",
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    'if __name__ == "__main__":',
    "raise NotImplementedError",
]
show_missing = true
skip_covered = false