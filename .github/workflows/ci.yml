# CI gate: Ruff + pytest (backend), ESLint + Vitest (frontend).
# Per docs/10-References/Test.md — integration tests use mocks; slow LLM eval is excluded.
name: CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/verify.sh"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/verify.sh"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: self-hosted
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Prevent host .env / runner secrets from turning CI into live LLM calls (Test.md §8.3).
      LLM_API_KEY: ""
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
      GOOGLE_API_KEY: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (Ruff)
        working-directory: backend
        run: ruff check app tests

      - name: Test (pytest)
        working-directory: backend
        run: pytest -q -m "not slow and not eval"

  frontend:
    runs-on: self-hosted
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test (Vitest)
        working-directory: frontend
        run: npm test
